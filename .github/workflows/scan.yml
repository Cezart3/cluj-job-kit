name: Daily job scan

on:
  schedule:
    - cron: "30 4 * * *"   # 06:30 / 07:30 Romania time
  workflow_dispatch:
  pull_request:
    paths: ["scanner/**"]

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the classifier
        run: python -m unittest discover -s scanner -v
      - name: Scan the boards
        if: github.event_name != 'pull_request'
        run: python scanner/run.py
      - name: Commit the new data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/jobs.json
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "data: daily scan $(date -u +%F)"
          git push
